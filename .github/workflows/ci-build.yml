name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Needed so the reusable workflow can optionally delete the temp per-OS artifacts it creates.
permissions:
  contents: read
  actions: write

jobs:
  build:
    uses: reactiveui/actions-common/.github/workflows/workflow-common-setup-and-build.yml@main
    with:
      configuration: Release
      productNamespacePrefix: ReactiveMvvm
      solutionFile: ReactiveMvvm.slnf
      installWorkloads: true
      testProjects: ReactiveMvvm.Tests/*.csproj
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  maui:
    name: MAUI ${{ matrix.framework }}-${{ matrix.platform.target }}
    runs-on: ${{ matrix.framework == 'net10.0' && matrix.platform.os == 'xcode-27' && 'macos-26' || matrix.platform.os }}
    env:
      # Match the Apple SDKs bundled with the latest .NET 11 workload.
      DEVELOPER_DIR: ${{ matrix.platform.os == 'xcode-27' && (matrix.framework == 'net10.0' && '/Applications/Xcode_26.0.1.app/Contents/Developer' || '/Applications/Xcode_27.2.app/Contents/Developer') || '' }}
    strategy:
      fail-fast: false
      matrix:
        framework: [net10.0, net11.0]
        platform:
          - os: ubuntu-latest
            target: android
            arguments: ''
          - os: windows-latest
            target: windows10.0.19041.0
            arguments: ''
          - os: xcode-27
            target: ios
            arguments: '-p:EnableCodeSigning=false'
          - os: xcode-27
            target: maccatalyst
            arguments: '-p:EnableCodeSigning=false'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup .NET Environment
        uses: reactiveui/actions-common/.github/actions/dotnet-environment@main
        with:
          dotnet-versions: 11.0.x
          solution-file: ReactiveMvvm.Maui/ReactiveMvvm.Maui.csproj
          install-workloads: 'true'
          stamp-version: 'false'
      - name: Build
        working-directory: src
        run: dotnet build ReactiveMvvm.Maui/ReactiveMvvm.Maui.csproj --configuration Release --framework ${{ matrix.framework }}-${{ matrix.platform.target }} ${{ matrix.platform.arguments }} ${{ matrix.platform.target == 'ios' && format('-p:RuntimeIdentifier={0}', matrix.framework == 'net10.0' && 'ios-arm64' || 'iossimulator-arm64') || '' }}
