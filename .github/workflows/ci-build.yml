name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Needed so the reusable workflow can optionally delete the temp per-OS artifacts it creates.
permissions:
  contents: read
  actions: write

jobs:
  build:
    uses: reactiveui/actions-common/.github/workflows/workflow-common-setup-and-build.yml@main
    with:
      configuration: Release
      productNamespacePrefix: ReactiveMvvm
      solutionFile: ReactiveMvvm.slnf
      installWorkloads: true
      testProjects: ReactiveMvvm.Tests/*.csproj
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  maui:
    name: MAUI ${{ matrix.framework }}-${{ matrix.platform.target }}
    runs-on: ${{ matrix.platform.os }}
    env:
      # The runner includes Xcode 27.2 but still defaults to 27.1.
      DEVELOPER_DIR: ${{ matrix.platform.os == 'xcode-27' && '/Applications/Xcode_27.2.app/Contents/Developer' || '' }}
    strategy:
      fail-fast: false
      matrix:
        framework: [net10.0, net11.0]
        platform:
          - os: ubuntu-latest
            target: android
            arguments: ''
          - os: windows-latest
            target: windows10.0.19041.0
            arguments: ''
          - os: xcode-27
            target: ios
            arguments: '-p:RuntimeIdentifier=iossimulator-arm64 -p:EnableCodeSigning=false'
          - os: xcode-27
            target: maccatalyst
            arguments: '-p:EnableCodeSigning=false'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup .NET Environment
        uses: reactiveui/actions-common/.github/actions/dotnet-environment@main
        with:
          dotnet-versions: 11.0.x
          solution-file: ReactiveMvvm.Maui/ReactiveMvvm.Maui.csproj
          install-workloads: 'true'
          stamp-version: 'false'
      # The .NET 11 workload includes the original .NET 10 Apple SDK, which requires Xcode 26.0.
      # Use the current .NET 10 workload for its Apple targets on the Xcode 27.2 runner.
      - name: Install .NET 10 for Apple targets
        if: matrix.framework == 'net10.0' && matrix.platform.os == 'xcode-27'
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          dotnet-version: 11.0.100
      - name: Select .NET 10 for Apple targets
        if: matrix.framework == 'net10.0' && matrix.platform.os == 'xcode-27'
        working-directory: src
        run: dotnet new globaljson --sdk-version 10.0.404 --roll-forward latestPatch --force
      - name: Install current .NET 10 Apple workloads
        if: matrix.framework == 'net10.0' && matrix.platform.os == 'xcode-27'
        working-directory: src
        run: dotnet workload install maui-ios maui-maccatalyst --version 10.0.404
      - name: Restore .NET 10 Apple target
        if: matrix.framework == 'net10.0' && matrix.platform.os == 'xcode-27'
        working-directory: src
        run: dotnet restore ReactiveMvvm.Maui/ReactiveMvvm.Maui.csproj -p:TargetFramework=${{ matrix.framework }}-${{ matrix.platform.target }} -p:Configuration=Release ${{ matrix.platform.arguments }}
      - name: Restore .NET 10 core reference
        if: matrix.framework == 'net10.0' && matrix.platform.os == 'xcode-27'
        working-directory: src
        run: dotnet restore ReactiveMvvm/ReactiveMvvm.csproj -p:TargetFramework=net10.0 -p:Configuration=Release
      - name: Build .NET 10 Apple target
        if: matrix.framework == 'net10.0' && matrix.platform.os == 'xcode-27'
        working-directory: src
        run: dotnet build ReactiveMvvm.Maui/ReactiveMvvm.Maui.csproj --no-restore --configuration Release --framework ${{ matrix.framework }}-${{ matrix.platform.target }} ${{ matrix.platform.arguments }}
      - name: Build
        if: matrix.framework != 'net10.0' || matrix.platform.os != 'xcode-27'
        working-directory: src
        run: dotnet build ReactiveMvvm.Maui/ReactiveMvvm.Maui.csproj --configuration Release --framework ${{ matrix.framework }}-${{ matrix.platform.target }} ${{ matrix.platform.arguments }}
